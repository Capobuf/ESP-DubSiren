[platformio]
default_envs = esp32-s3-devkitc-1-n16r8

[env:esp32-s3-devkitc-1-n16r8]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1-n16r8
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
lib_deps =
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
    adafruit/Adafruit BusIO@1.17.4
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Saved hardware/kicad schematic: 74HC4051 panel + physical Master.
; Keep unconnected DevKit inputs disabled in the default environment.
[env:panel-prototype]
extends = env:esp32-s3-devkitc-1-n16r8
build_flags =
    ${env:esp32-s3-devkitc-1-n16r8.build_flags}
    -DDUBSIREN_PHYSICAL_PANEL=1

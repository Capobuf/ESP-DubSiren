[platformio]
default_envs = esp32-s3-devkitc-1-n16r8

[env:esp32-s3-devkitc-1-n16r8]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1-n16r8
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
lib_deps =
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4
; -O2 instead of Arduino's -Os: on the first PCB the 480-sample render drops
; from about 7.4 ms (max 9.2) to 5.5 ms (max 7.1) of the 10 ms block.
build_unflags = -Os
build_flags =
    -O2
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Saved hardware/kicad schematic: 74HC4051 panel + physical Master.
; Keep unconnected DevKit inputs disabled in the default environment.
[env:panel-prototype]
extends = env:esp32-s3-devkitc-1-n16r8
build_flags =
    ${env:esp32-s3-devkitc-1-n16r8.build_flags}
    -DDUBSIREN_PHYSICAL_PANEL=1

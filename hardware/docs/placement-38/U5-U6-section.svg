<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 123" width="190mm" height="123mm"><rect x="0" y="0" width="190" height="123" fill="#f5f7f8" /><text x="6" y="9" fill="#17232e" font-size="4.2" font-family="Arial">#38 / DAC prima, display dopo</text><text x="6" y="15" fill="#17232e" font-size="2.8" font-family="Arial">Sezione schematica non in scala: quote di montaggio ancora da misurare</text><rect x="28" y="32" width="100" height="4" fill="#48768c" /><rect x="42" y="24" width="72" height="8" fill="#193e4f" /><text x="133" y="31" fill="#17232e" font-size="2.8" font-family="Arial">U5 / H prodotto 5,4 mm</text><rect x="52" y="36" width="28" height="9" fill="#b28f4e" /><text x="53" y="41" fill="#fff" font-size="2.3" font-family="Arial">microSD / flex</text><rect x="20" y="62" width="124" height="6" fill="#b6c0c7" /><text x="149" y="65" fill="#17232e" font-size="2.6" font-family="Arial">carrier 1,6 mm*</text><rect x="40" y="49" width="3" height="19" fill="#c69a47" /><polygon points="38,62 45,62 43,56 40,56" fill="#a49f94" /><text x="24" y="54" fill="#17232e" font-size="2.7" font-family="Arial">hF</text><rect x="95" y="56" width="9" height="6" fill="#c4cdd1" /><line x1="99.5" y1="62" x2="99.5" y2="85" stroke="#68757f" stroke-width="1.2" /><rect x="30" y="85" width="100" height="4" fill="#48768c" /><rect x="65" y="89" width="38" height="10" fill="#314856" /><text x="135" y="90" fill="#17232e" font-size="2.8" font-family="Arial">U6 / H prodotto 6,2 mm</text><rect x="39" y="68" width="5" height="17" fill="#c69a47" /><text x="47" y="79" fill="#17232e" font-size="2.7" font-family="Arial">header + distanza g6</text><line x1="16" y1="36" x2="16" y2="62" stroke="#576876" stroke-width="0.25" /><line x1="13" y1="36" x2="19" y2="36" stroke="#576876" stroke-width="0.25" /><line x1="13" y1="62" x2="19" y2="62" stroke="#576876" stroke-width="0.25" /><text x="2" y="50" fill="#17232e" font-size="2.7" font-family="Arial">g5</text><line x1="86" y1="45" x2="86" y2="56" stroke="#b67d22" stroke-width="0.5" /><line x1="83" y1="45" x2="89" y2="45" stroke="#b67d22" stroke-width="0.25" /><line x1="83" y1="56" x2="89" y2="56" stroke="#b67d22" stroke-width="0.25" /><text x="90" y="51" fill="#9b6215" font-size="2.5" font-family="Arial">gioco residuo</text><text x="6" y="109" fill="#17232e" font-size="3.1" font-family="Arial">Condizione: g5 &gt; hU5 + hF + margine verificato sul pezzo.</text><text x="6" y="114" fill="#17232e" font-size="2.6" font-family="Arial">hF = massimo di giunti, pin e teste DAC; hU5 = sporgenza sotto il display.</text><text x="6" y="119" fill="#17232e" font-size="2.5" font-family="Arial">5,4 / 6,2 sono altezze prodotto: non determinano g5, g6 o Hmax. *Riferimento carrier.</text></svg>

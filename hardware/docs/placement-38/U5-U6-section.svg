<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 212 165" width="212mm" height="165mm"><rect x="0" y="0" width="212" height="165" fill="#f5f7f8" /><text x="6" y="9" fill="#17232e" font-size="4.2" font-family="Arial">#38 / prova header SLxG1</text><text x="6" y="15" fill="#17232e" font-size="2.7" font-family="Arial">Corto 3,00 verso portante; isolanti fra le PCB. Nessuna quota definitiva approvata.</text><text x="6" y="21" fill="#17232e" font-size="2.5" font-family="Arial">Sezione composta, non in scala; estremità lunghe interrotte; spessori t5/t6 ignoti.</text><rect x="34" y="41" width="128" height="4" fill="#48768c" /><text x="37" y="38" fill="#17232e" font-size="2.8" font-family="Arial">U5 / PCB display, t5 da misurare</text><rect x="48" y="45" width="43" height="10" fill="none" stroke="#ad7b2a" stroke-width="0.3" stroke-dasharray="1 1" /><text x="50" y="51" fill="#98661b" font-size="2.4" font-family="Arial">hU5 ? microSD / flex</text><rect x="15" y="70" width="153" height="16" fill="#b6c0c7" /><text x="20" y="79" fill="#17232e" font-size="3.0" font-family="Arial">portante</text><rect x="34" y="111" width="128" height="4" fill="#48768c" /><text x="95" y="120" fill="#17232e" font-size="2.8" font-family="Arial">U6 / PCB DAC, t6 da misurare</text><rect x="67" y="86" width="8" height="25" fill="#3e474c" /><line x1="71" y1="56" x2="71" y2="128" stroke="#c69a47" stroke-width="1.1" /><rect x="127" y="45" width="8" height="25" fill="#3e474c" /><line x1="131" y1="28" x2="131" y2="100" stroke="#c69a47" stroke-width="1.1" /><line x1="69" y1="124" x2="73" y2="126" stroke="#f5f7f8" stroke-width="1.4" /><line x1="69" y1="124" x2="73" y2="126" stroke="#66747d" stroke-width="0.3" /><line x1="129" y1="30" x2="133" y2="32" stroke="#f5f7f8" stroke-width="1.4" /><line x1="129" y1="30" x2="133" y2="32" stroke="#66747d" stroke-width="0.3" /><text x="78" y="102" fill="#17232e" font-size="2.7" font-family="Arial">SL8 / SL6</text><text x="140" y="63" fill="#17232e" font-size="2.7" font-family="Arial">SL11</text><line x1="22" y1="45" x2="22" y2="70" stroke="#576876" stroke-width="0.25" /><line x1="19" y1="45" x2="25" y2="45" stroke="#576876" stroke-width="0.25" /><line x1="19" y1="70" x2="25" y2="70" stroke="#576876" stroke-width="0.25" /><text x="2" y="55" fill="#17232e" font-size="2.6" font-family="Arial">g5</text><text x="2" y="60" fill="#17232e" font-size="2.6" font-family="Arial">2,50</text><line x1="22" y1="86" x2="22" y2="111" stroke="#576876" stroke-width="0.25" /><line x1="19" y1="86" x2="25" y2="86" stroke="#576876" stroke-width="0.25" /><line x1="19" y1="111" x2="25" y2="111" stroke="#576876" stroke-width="0.25" /><text x="2" y="96" fill="#17232e" font-size="2.6" font-family="Arial">g6</text><text x="2" y="101" fill="#17232e" font-size="2.6" font-family="Arial">2,50</text><line x1="59" y1="56" x2="59" y2="70" stroke="#a16b1b" stroke-width="0.25" /><line x1="56" y1="56" x2="62" y2="56" stroke="#a16b1b" stroke-width="0.25" /><line x1="56" y1="70" x2="62" y2="70" stroke="#a16b1b" stroke-width="0.25" /><text x="40" y="64" fill="#98661b" font-size="2.8" font-family="Arial">1,40</text><line x1="101" y1="45" x2="101" y2="56" stroke="#a16b1b" stroke-width="0.25" /><line x1="98" y1="45" x2="104" y2="45" stroke="#a16b1b" stroke-width="0.25" /><line x1="98" y1="56" x2="104" y2="56" stroke="#a16b1b" stroke-width="0.25" /><text x="105" y="52" fill="#98661b" font-size="2.8" font-family="Arial">1,10*</text><line x1="176" y1="70" x2="176" y2="86" stroke="#576876" stroke-width="0.25" /><line x1="173" y1="70" x2="179" y2="70" stroke="#576876" stroke-width="0.25" /><line x1="173" y1="86" x2="179" y2="86" stroke="#576876" stroke-width="0.25" /><text x="182" y="78" fill="#17232e" font-size="2.8" font-family="Arial">1,60</text><text x="140" y="96" fill="#17232e" font-size="2.5" font-family="Arial">pin U5 su B.Cu: 1,40</text><text x="6" y="135" fill="#17232e" font-size="2.7" font-family="Arial">* Budget nominale fra punta pin U6 e piano PCB U5: 2,50 - (3,00 - 1,60).</text><text x="6" y="141" fill="#17232e" font-size="2.6" font-family="Arial">Non comprende i volumi contrapposti di componenti, giunti, viti e margini di montaggio.</text><text x="6" y="147" fill="#17232e" font-size="2.6" font-family="Arial">Con le sole tolleranze header: budget fino a 0,65 mm, portante fissata a 1,60 mm.</text><text x="6" y="153" fill="#17232e" font-size="2.6" font-family="Arial">I lati lunghi sono 6,10 mm: residui oltre i breakout = 6,10 - t5 / 6,10 - t6.</text><text x="6" y="159" fill="#17232e" font-size="2.6" font-family="Arial">Disegno della prova SLxG1: non descrive gli header inclusi Adafruit né certifica lo stack.</text></svg>

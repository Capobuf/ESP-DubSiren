name: One-time merged branch cleanup
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-branch-cleanup.yml
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event.head_commit.message == 'chore: one-time merged branch cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Verify and remove obsolete branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branches=(
            'chore/hardware-cleanup'
            'codex/issue-3-panel-completion'
            'codex/issue-5-lickshot'
            'codex/issue-6-trigger-events'
            'codex/issue-7-two-tone'
            'codex/issue-8-dry-tone'
            'codex/issue-9-echo-color'
            'codex/issue-10-performance-menu'
            'codex/issue-11-pad-memories'
            'codex/issue-12-standalone'
            'codex/issue-13-tap-tempo'
            'codex/issue-14-mechanical-validation'
            'codex/repository-review'
            'feature/saw-triangle-voices'
          )
          for branch in "${branches[@]}"; do
            ahead="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${branch}" --jq '.ahead_by')"
            if [[ "$ahead" != "0" ]]; then
              echo "::error::Refusing to delete ${branch}: ahead_by=${ahead}"
              exit 1
            fi
          done
          for branch in "${branches[@]}"; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" --silent
            echo "Deleted ${branch}"
          done

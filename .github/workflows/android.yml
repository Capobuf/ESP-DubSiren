name: Android APK

# Builds the simulator APK on every change to the app or the shared firmware
# sources. Pushes and manual runs also publish it as a GitHub Release (one
# installable .apk), keeping only the two newest; pull requests only build.

on:
  push:
    paths:
      - 'Android/**'
      - 'app/native/**'
      - 'firmware/src/**'
      - 'firmware/include/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'Android/**'
      - 'app/native/**'
      - 'firmware/src/**'
      - 'firmware/include/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Same file the Gradle build reads locally (Android/app/build.gradle.kts).
      # Without the secrets (pull requests from forks) the APK gets a debug key.
      - name: Release key from secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::warning::No signing secrets: the APK is signed with a throwaway debug key."
            exit 0
          fi
          mkdir -p ~/.dubsiren-signing
          echo "$KEYSTORE" | base64 -d > ~/.dubsiren-signing/dubsiren-release.jks
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=dubsiren\nkeyPassword=%s\n' \
            "$HOME/.dubsiren-signing/dubsiren-release.jks" "$PASSWORD" "$PASSWORD" \
            > ~/.dubsiren-signing/signing.properties

      - name: Build release APK
        working-directory: Android
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Name the APK
        id: apk
        run: |
          name="DubSiren-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}.apk"
          cp ~/.dubsiren-android/app/outputs/apk/release/app-release.apk "$name"
          echo "file=$name" >> "$GITHUB_OUTPUT"
          rm -rf ~/.dubsiren-signing

      - name: Publish release and keep the two newest
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.file }}
        run: |
          tag="apk-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "$APK" --target "$GITHUB_SHA" \
            --title "DubSiren APK ${GITHUB_RUN_NUMBER}" \
            --notes "Simulatore Android della sirena, da ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Scaricare il file .apk sul dispositivo e aprirlo per installarlo (consentire l'installazione da questa origine)."
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("apk-"))] | sort_by(.createdAt) | reverse | .[2:] | .[].tagName' |
          while read -r old; do
            gh release delete "$old" --yes --cleanup-tag
          done

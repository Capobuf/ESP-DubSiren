name: Firmware and simulator

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pc/requirements.txt
      - run: python -m pip install -r pc/requirements.txt
      - name: Python and Virtual ESP regressions (stop on first failure)
        run: python -m unittest discover -s pc -p "test_*.py" -f
      - name: Native DSP and controller regressions
        run: python tests/native/run.py

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install platformio==6.2.0
      - name: Build DevKit and standalone panel
        run: python -m platformio run -d firmware -e esp32-s3-devkitc-1-n16r8 -e panel-prototype
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            firmware/.pio/build/*/firmware.bin
            firmware/.pio/build/*/firmware.elf
            firmware/.pio/build/*/bootloader.bin
            firmware/.pio/build/*/partitions.bin
